name: Documentation Check

on:
push:
branches:
- main
pull_request:
branches:
- main

permissions:
contents: read

jobs:
docs-check:
name: Check Public Documentation
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4
  - name: Check required files
    shell: bash
    run: |
      set -e
      required_files=(
        "README.md"
        "LICENSE"
        "CHANGELOG.md"
        "SECURITY.md"
      )
      for file in "${required_files[@]}"; do
        if [ ! -f "$file" ]; then
          echo "Missing required file: $file"
          exit 1
        fi
      done
      echo "All required public documentation files are present."
  - name: Check docs directory
    shell: bash
    run: |
      if [ ! -d "docs" ]; then
        echo "Missing docs/ directory."
        exit 1
      fi
      echo "docs/ directory exists."
  - name: Check for accidentally committed environment files
    shell: bash
    run: |
      if find . -type f \
        \( -name ".env" -o -name ".env.local" -o -name ".env.production" \) \
        -not -path "./.git/*" | grep -q .; then
        echo "Environment files were detected in the repository."
        exit 1
      fi
      echo "No tracked environment files detected."

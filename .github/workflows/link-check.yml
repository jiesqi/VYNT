name: Link Check

on:
push:
branches:
- main
pull_request:
branches:
- main
schedule:
- cron: “0 6 * * 1”

permissions:
contents: read

jobs:
link-check:
name: Check Documentation Links
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4
  - name: Check links
    uses: lycheeverse/lychee-action@v2
    with:
      args: >
        --verbose
        --no-progress
        "**/*.md"
      fail: true

name: Markdown Lint

on:
push:
branches:
- main
pull_request:
branches:
- main

permissions:
contents: read

jobs:
markdown-lint:
name: Lint Markdown
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4
  - name: Run Markdown lint
    uses: DavidAnson/markdownlint-cli2-action@v20
    with:
      globs: |
        **/*.md
        !node_modules/**
